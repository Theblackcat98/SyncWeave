name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only token for every job. Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        # SHA-pinned (P2-24). Dependabot keeps these current: .github/dependabot.yml.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        # Reads .bun-version (P2-25), so CI and the README cannot drift apart.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test with coverage floors
        # Runs the whole suite, including the headless app smoke test, and fails
        # below the floors in bunfig.toml.
        run: bun run test:coverage

  release:
    name: build ${{ matrix.asset }}
    # Tags only. Builds release binaries after the check job passes on every OS.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: bun-linux-x64
            asset: syncweave-linux-x64
          - target: bun-linux-arm64
            asset: syncweave-linux-arm64
          - target: bun-darwin-arm64
            asset: syncweave-darwin-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build single-file binary
        run: bun build --compile --target=${{ matrix.target }} src/main.ts --outfile dist/${{ matrix.asset }}
      - name: Check the binary runs (linux-x64 only)
        if: matrix.target == 'bun-linux-x64'
        run: ./dist/${{ matrix.asset }} --version
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 30
